name: CI/CD Pipeline to Railway

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'monitoring/**'

permissions:
  contents: read
  pull-requests: read

jobs:
  # 1. Job to detect changes in the monorepo
  changes:
    runs-on: [self-hosted, phoenix-runner]
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ukt: ${{ steps.filter.outputs.ukt }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'web/**'
              - '.github/workflows/cicd.yml'
            ukt:
              - 'UKT/**'
              - '.github/workflows/cicd.yml'

  # 2. Web Service CI (Build & Test)
  web-build-test:
    needs: changes
    if: ${{ needs.changes.outputs.web == 'true' }}
    runs-on: [self-hosted, phoenix-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: cd web && npm ci

      - name: Run Type Check
        run: cd web && npx tsc --noEmit

      - name: Run lint
        run: cd web && npm run lint

      - name: Run Build Safety Smoke Tests
        run: cd web && NEXT_PHASE=phase-production-build npx vitest run tests/smoke tests/lib

      - name: Run Unit tests
        run: cd web && npm run test

  # 3. UKT Service CI (Build & Test)
  ukt-build-test:
    needs: changes
    if: ${{ needs.changes.outputs.ukt == 'true' }}
    runs-on: [self-hosted, phoenix-runner]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest httpx
          if [ -f UKT/requirements.txt ]; then pip install -r UKT/requirements.txt; fi

      - name: Run UKT lint
        run: ruff check UKT

      - name: Run UKT tests
        run: |
          cd UKT
          pytest test_api.py -v

  # 4. Deploy Jobs
  deploy-web:
    needs: [changes, web-build-test]
    if: |
      always() && 
      needs.changes.outputs.web == 'true' && 
      (needs.web-build-test.result == 'success' || needs.web-build-test.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, phoenix-runner]
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure npm for self-hosted runner
        shell: bash
        run: |
          NPM_GLOBAL_DIR="${RUNNER_TEMP:-/tmp}/npm-global"
          mkdir -p "$NPM_GLOBAL_DIR"
          npm config set prefix "$NPM_GLOBAL_DIR"
          echo "NPM_CONFIG_PREFIX=$NPM_GLOBAL_DIR" >> "$GITHUB_ENV"
      - name: Install Railway CLI
        run: npm install --no-save --no-audit --no-fund @railway/cli
      - name: Deploy Web App to Railway
        run: ./node_modules/.bin/railway up --service web --environment production --detach

  deploy-ukt:
    needs: [changes, ukt-build-test]
    if: |
      always() && 
      needs.changes.outputs.ukt == 'true' && 
      (needs.ukt-build-test.result == 'success' || needs.ukt-build-test.result == 'skipped') &&
      github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, phoenix-runner]
    env:
      RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Configure npm for self-hosted runner
        shell: bash
        run: |
          NPM_GLOBAL_DIR="${RUNNER_TEMP:-/tmp}/npm-global"
          mkdir -p "$NPM_GLOBAL_DIR"
          npm config set prefix "$NPM_GLOBAL_DIR"
          echo "NPM_CONFIG_PREFIX=$NPM_GLOBAL_DIR" >> "$GITHUB_ENV"
      - name: Install Railway CLI
        run: npm install --no-save --no-audit --no-fund @railway/cli
      - name: Deploy UKT Service to Railway
        run: ./node_modules/.bin/railway up --service ukt-service --environment production --detach
