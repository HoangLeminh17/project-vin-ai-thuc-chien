services:
  # Redis for Rate Limiting
  redis:
    image: redis:alpine
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # UKT Knowledge Tracing Microservice (Python)
  ukt-service:
    build:
      context: ./UKT
      dockerfile: Dockerfile
    environment:
      - PORT=8000
      - UKT_CHECKPOINT_PATH=/app/model/checkpoints/latest.ckpt
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - REDIS_URL=redis://redis:6379
    ports:
      - "8000:8000"
    volumes:
      - ./UKT/model/checkpoints:/app/model/checkpoints
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Synapsy Web App (Next.js)
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
        - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
        - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
        - NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET}
        - NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID}
        - NEXT_PUBLIC_FIREBASE_APP_ID=${NEXT_PUBLIC_FIREBASE_APP_ID}
    environment:
      - UKT_SERVICE_URL=http://ukt-service:8000
      - NEXT_PUBLIC_FIREBASE_API_KEY=${NEXT_PUBLIC_FIREBASE_API_KEY}
      - NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN}
      - NEXT_PUBLIC_FIREBASE_PROJECT_ID=${NEXT_PUBLIC_FIREBASE_PROJECT_ID}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_STORAGE_BUCKET=${FIREBASE_STORAGE_BUCKET}
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - HUGGINGFACE_API_KEY=${HUGGINGFACE_API_KEY}
      - HUGGINGFACE_MODEL=${HUGGINGFACE_MODEL}
      - AI_PROVIDER=${AI_PROVIDER}
      - PDF_MINERU_BASE_URL=${PDF_MINERU_BASE_URL}
      - PDF_MINERU_API_KEY=${PDF_MINERU_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    ports:
      - "3002:3000"
    depends_on:
      ukt-service:
        condition: service_healthy
      redis:
        condition: service_started

  # Prometheus for metrics collection
  prometheus:
    build:
      context: ./monitoring/prometheus
      dockerfile: Dockerfile
    environment:
      - SCRAPER_TOKEN=${SCRAPER_TOKEN}
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

    depends_on:
      - web

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
      - loki
      - jaeger

  # OpenTelemetry Collector
  otel-collector:
    build:
      context: ./monitoring/otel-collector
      dockerfile: Dockerfile
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus metrics
    networks:
      default:
        aliases:
          - otel-collector.railway.internal
    depends_on:
      - jaeger
      - loki

  # Jaeger for distributed tracing
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686" # Jaeger UI
    networks:
      default:
        aliases:
          - jaeger.railway.internal

  # Loki for centralized logging
  loki:
    image: grafana/loki:latest
    ports:
      - "3101:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      default:
        aliases:
          - loki.railway.internal

  # Alertmanager
  alertmanager:
    build:
      context: ./monitoring/alertmanager
      dockerfile: Dockerfile
    environment:
      - DISCORD_BRIDGE_URL=http://discord-bridge.railway.internal:8080/alertmanager
    ports:
      - "9093:9093"
    networks:
      default:
        aliases:
          - alertmanager.railway.internal

  # Discord bridge for Alertmanager webhooks
  discord-bridge:
    build:
      context: ./monitoring/bridge
      dockerfile: Dockerfile
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - DISCORD_USERNAME=Alertmanager
    ports:
      - "8080:8080"
    networks:
      default:
        aliases:
          - discord-bridge.railway.internal

volumes:
  redis-data:
