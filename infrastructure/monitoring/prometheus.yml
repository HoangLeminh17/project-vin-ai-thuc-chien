global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'synapsy-app'
    metrics_path: '/api/metrics'
    scheme: 'https' # Use https for public URL or http for internal
    static_configs:
      - targets: ['20a-app-046.up.railway.app'] # Thay bằng domain thật của bạn hoặc internal URL
