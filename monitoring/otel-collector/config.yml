receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  # Collect logs from containers (Railway stdout)
  # Note: In Railway, we might rely on services sending logs directly to Loki 
  # or use the OTLP log receiver if the app supports it.
  
processors:
  batch:
    timeout: 1s
  memory_limiter:
    check_interval: 1s
    limit_mib: 400
    spike_limit_mib: 100

exporters:
  # Traces to Jaeger
  otlp/jaeger:
    endpoint: jaeger.railway.internal:4317
    tls:
      insecure: true

  # Logs to Loki
  loki:
    endpoint: http://loki.railway.internal:3100/loki/api/v1/push

  # Metrics to Prometheus (Optional, if using OTel for metrics)
  prometheus:
    endpoint: 0.0.0.0:8889

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki]
