global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    project: "synapsy"
    environment: "production"

# =============================================
# ALERTING (bỏ comment khi cần dùng)
# =============================================
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager.railway.internal:9093"]

# rule_files:
#   - "alerts/*.yml"

# =============================================
# SCRAPE CONFIGS
# =============================================
scrape_configs:

  # --- Prometheus tự monitor chính nó ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # --- Next.js Web App ---
  # Đảm bảo tên service trên Railway là "web", nếu khác thì sửa lại
  - job_name: "web"
    static_configs:
      - targets: ["web.railway.internal:3000"]
    metrics_path: /api/metrics
    scrape_interval: 30s

  # --- UKT Python Microservice ---
  # Đảm bảo tên service trên Railway là "ukt-service", nếu khác thì sửa lại
  - job_name: "ukt-service"
    static_configs:
      - targets: ["web.railway.internal:8080"]
    metrics_path: /metrics
    scrape_interval: 30s

  # --- Redis ---
  # Nếu dùng Redis plugin của Railway, thay target thành tên service Redis
  # Redis không tự expose Prometheus metrics → cần redis_exporter
  # Tạm thời comment lại nếu chưa có redis_exporter
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["redis-exporter.railway.internal:9121"]
  #   metrics_path: /metrics
  #   scrape_interval: 30s
