global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

  external_labels:
    project: "synapsy"
    environment: "production"

# =============================================
# ALERTING
# =============================================
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ["alertmanager.railway.internal:9093"]

# rule_files:
#   - "alerts/*.yml"

# =============================================
# SCRAPE CONFIGS
# =============================================
scrape_configs:

  # --- Prometheus tự monitor chính nó ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
    metrics_path: /metrics

  # --- Next.js Web App ---
  - job_name: "web"
    static_configs:
      # Sử dụng biến Private Domain của web service
      - targets: ["20a-app-046.up.railway.app"]
    metrics_path: /api/metrics
    scrape_interval: 30s
    authorization:
      type: Bearer
      credentials: "${SCRAPER_TOKEN}"

  # --- UKT Python Microservice ---
  - job_name: "ukt-service"
    static_configs:
      # Sử dụng biến bạn yêu cầu cho ukt-service
      - targets: ["ukt-service-production.up.railway.app"]
    metrics_path: /metrics
    scrape_interval: 30s

  # --- Redis (Nếu có redis-exporter) ---
  # - job_name: "redis"
  #   static_configs:
  #     - targets: ["${{redis-exporter.RAILWAY_PRIVATE_DOMAIN}}:9121"]
  #   metrics_path: /metrics
  #   scrape_interval: 30s